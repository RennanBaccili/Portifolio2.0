<a 
  *ngIf="isLink"
  [href]="href" 
  [target]="targetValue"
  [class]="variantClass" 
  [attr.aria-disabled]="disabled"
  [attr.aria-label]="ariaLabelValue"
  [attr.title]="titleValue">
  @if (text) {
    {{ text }}
  } @else {
    <ng-content></ng-content>
  }
</a>
<button 
  *ngIf="!isLink"
  [type]="typeValue" 
  [class]="variantClass" 
  [disabled]="disabled"
  [attr.aria-label]="ariaLabelValue"
  [attr.title]="titleValue">
  @if (text) {
    {{ text }}
  } @else {
    <ng-content></ng-content>
  }
</button>
