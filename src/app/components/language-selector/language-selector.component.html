<div class="language-selector">
  <button 
    class="lang-btn" 
    [class.active]="currentLanguage() === 'pt'"
    (click)="selectLanguage('pt')"
    [attr.aria-label]="'Português'"
    title="Português">
    <span class="flag">🇧🇷</span>
  </button>
  <button 
    class="lang-btn" 
    [class.active]="currentLanguage() === 'en'"
    (click)="selectLanguage('en')"
    [attr.aria-label]="'English'"
    title="English">
    <span class="flag">🇺🇸</span>
  </button>
</div>
